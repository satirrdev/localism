name: CI

# Local machines are deliberately kept light: the heavy Next build, lint and
# supply-chain audit run here in CI, not on contributors' devices. There is
# no test runner in this repo; `npm run build` (Turbopack) + `npm run lint`
# are the gate, and `npm audit` protects the supply chain (0-vuln baseline).
#
# The same build is published to GitHub Pages on main: Next runs in static
# export mode (`output: "export"`) and the exported `out/` directory is
# uploaded as the Pages artifact.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint · build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      # GitHub Pages serves this project site from a sub-path.
      NEXT_PUBLIC_BASE_PATH: /localism
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # next requires >=20.9.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Build (Turbopack, static export)
        run: npm run build

      - name: Audit (supply chain)
        run: npm audit --audit-level=high

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4